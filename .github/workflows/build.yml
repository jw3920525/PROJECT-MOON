name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 임시 폴더용 3 파일 자동 삭제
        run: find android/app/src/main/res -name "3" -delete

      - name: build_android.sh 실행 권한 부여
        run: chmod +x build_android.sh

      - name: APK 빌드 스크립트 실행
        run: ./build_android.sh

      - name: 생성된 APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: LimbusBeep-APK
          path: dist/*.apk
